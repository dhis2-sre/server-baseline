# Adapted from https://github.com/dhis2-sre/microk8s-playbook/blob/master/playbooks/harden.yaml
# Modified for a Docker host

- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Enable unattended-upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    regexp: '^\s*\"(APT::Periodic::Unattended-Upgrade)\".*;'
    line: '"APT::Periodic::Unattended-Upgrade" "1";'

# The upgrade above can pull in a new openssh-server, whose postinst stops ssh.service. Ubuntu 24.04
# activates sshd from ssh.socket, so nothing starts the service again until the next new connection,
# and systemd removes the unit's RuntimeDirectory, /run/sshd, when it stops. The `sshd -t` validation
# below needs that directory, and this play reuses its existing connection rather than opening a new
# one, so on any host with an openssh update pending the SSH tasks would fail with "Missing privilege
# separation directory". Starting the service recreates the directory and gives the reload below a
# live unit to reload. On 26.04 ssh.service runs alongside the socket, so there this task only does
# something if the upgrade just stopped it.
- name: Ensure sshd is running before validating its configuration
  ansible.builtin.service:
    name: ssh
    state: started

# SSH Hardening
#
# sshd takes the first value it reads for most keywords, and Ubuntu's sshd_config includes
# sshd_config.d/*.conf at the top, so a line in sshd_config loses to any drop-in that sets the same
# keyword. Cloud images ship one: 50-cloud-init.conf sets PasswordAuthentication yes whenever the
# provider enabled password logins. These settings therefore go in a drop-in that sorts ahead of the
# ones Ubuntu and cloud-init ship. AllowUsers stays in sshd_config, because it adds up across every
# file rather than taking the first value, so drop-in order does not change what it allows. It is
# appended to the end of the file, though, which puts it inside a Match block if the file ends with
# one, so the check below also confirms it applies globally.
# sshd listens on ssh_port. The port this play is connected on stays open alongside it, so the move
# takes two runs and never strands the play: the second, with ansible_port set to ssh_port, closes the
# old port. "client_ip client_port server_ip server_port", read without become, which drops it, and
# empty for a local connection.
- name: Read the port this play is connected on
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: harden_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false

- name: Work out the ports sshd listens on
  ansible.builtin.set_fact:
    harden_ssh_ports: "{{ ([ssh_port] + harden_ssh_connection.stdout.split()[3:4]) | map('int') | unique | sort }}"

- name: Write the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s

- name: Allow specific SSH users
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowUsers'
    line: "AllowUsers {{ (allowed_ssh_users + [docker_user]) | unique | join(' ') }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s

# Reloaded on every run rather than from a handler, whose notification is lost when a run stops
# between writing the files and the end of the play, leaving a rerun with nothing to change and sshd
# still on the old configuration. A reload re-reads the configuration without dropping connections,
# including the one running this play, and afterwards the running sshd matches the files the check
# below reads.
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded
  changed_when: false

- name: Read the effective SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: harden_sshd_effective
  changed_when: false
  when: not ansible_check_mode

- name: Assert the SSH hardening is in effect
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in harden_sshd_effective.stdout_lines"
      - "'passwordauthentication no' in harden_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in harden_sshd_effective.stdout_lines"
      - (allowed_ssh_users + [docker_user]) | unique | difference(harden_sshd_allowusers) | length == 0
      - harden_sshd_ports == harden_ssh_ports
    fail_msg: >-
      sshd's effective configuration is not hardened: `sshd -T` shows
      {{ harden_sshd_effective.stdout_lines
      | select('match', '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|allowusers|port) ')
      | join(', ') }}. A drop-in sorting before 00-hardening.conf or a `Match all` block may override
      the first three, AllowUsers is missing when it ended up inside a Match block at the end of
      sshd_config, and Port adds up across files, so a Port line anywhere else keeps its port open.
  vars:
    harden_sshd_allowusers: >-
      {{ harden_sshd_effective.stdout_lines | select('match', '^allowusers ')
      | map('regex_replace', '^allowusers ', '') | list }}
    harden_sshd_ports: >-
      {{ harden_sshd_effective.stdout_lines | select('match', '^port ')
      | map('regex_replace', '^port ', '') | map('int') | unique | sort }}
  when: not ansible_check_mode

- name: Move sshd to ssh_port
  ansible.builtin.import_tasks: ssh-port.yml

# Minimize Attack Surface
- name: Remove unnecessary packages
  ansible.builtin.apt:
    name:
      - telnet
      - ftp
      - rsh-client
      - nfs-common
      - cups
      - dnsutils
    state: absent

# Secure /tmp
- name: Secure /tmp partition
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noexec,nosuid,nodev"
    state: present

- name: Mount or remount /tmp with secure options
  ansible.builtin.raw: |
    if mountpoint -q /tmp; then
      mount --options remount,defaults,noexec,nosuid,nodev /tmp
    else
      mount --types tmpfs --options defaults,noexec,nosuid,nodev tmpfs /tmp
    fi
  changed_when: false

# Logging and Monitoring
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  notify: Restart fail2ban

- name: Point fail2ban's sshd jail at the SSH ports
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/sre-server-sshd.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

# Started rather than restarted, so a run with nothing to change leaves fail2ban watching the logs.
# A change that needs a restart notifies the handler instead.
- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# Written to a drop-in rather than /etc/sysctl.conf, which Ubuntu 26.04 no longer reads at boot. The
# name sorts after Ubuntu's own sysctl.d files, such as 10-network-security.conf on 24.04 and
# 55-network-security.conf on 26.04, which set rp_filter to 2, so these values win at boot.
- name: Set kernel parameters for hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-sre-server-hardening.conf
    state: present
  loop: "{{ harden_kernel_parameters }}"
  loop_control:
    label: "{{ item.key }}"

# Earlier versions wrote these to /etc/sysctl.conf. 24.04 still applies that file at boot, through
# 99-sysctl.conf, after the drop-in above, so a value left there would win over a changed one. A
# missing file is left alone.
- name: Remove the kernel parameters earlier versions wrote to /etc/sysctl.conf
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    sysctl_file: /etc/sysctl.conf
    state: absent
    reload: false
  loop: "{{ harden_kernel_parameters }}"
  loop_control:
    label: "{{ item.key }}"

# Docker-specific hardening
- name: Configure subuid for user namespace remapping
  # Allocates UID range 100000-165535 for the user, enabling Docker to remap container UIDs
  ansible.builtin.lineinfile:
    path: /etc/subuid
    # Matches any existing entry for the user, so one with a different range is replaced rather
    # than left alongside a second entry.
    regexp: "^{{ docker_user | regex_escape }}:"
    line: "{{ docker_user }}:100000:65536"
    create: true
    mode: '0644'

- name: Configure subgid for user namespace remapping
  # Allocates GID range 100000-165535 for the user, enabling Docker to remap container GIDs
  ansible.builtin.lineinfile:
    path: /etc/subgid
    # Matches any existing entry for the user, so one with a different range is replaced rather
    # than left alongside a second entry.
    regexp: "^{{ docker_user | regex_escape }}:"
    line: "{{ docker_user }}:100000:65536"
    create: true
    mode: '0644'

- name: Install AppArmor utils and profiles
  ansible.builtin.apt:
    name:
      - apparmor-utils
      - apparmor-profiles
    state: present

# command rather than a shell pipe into grep, so there is no pipeline whose exit status has to be
# reasoned about.
- name: Check if Docker AppArmor profile is loaded
  ansible.builtin.command: apparmor_status
  register: harden_apparmor_status
  failed_when: false
  changed_when: false
  # Reads nothing but the kernel's own view, so it is safe to run under --check, where the assert
  # below needs its stdout.
  check_mode: false

- name: Assert Docker AppArmor profile is loaded
  ansible.builtin.assert:
    that: "'docker' in harden_apparmor_status.stdout"
    fail_msg: "Docker AppArmor profile is not loaded. Ensure AppArmor is configured for Docker security."

- name: Configure Docker daemon for security
  ansible.builtin.include_tasks: docker_daemon.yml

- name: Restrict Docker socket permissions
  ansible.builtin.file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0660'
