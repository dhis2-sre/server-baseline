# Adapted from https://github.com/dhis2-sre/microk8s-playbook/blob/master/playbooks/harden.yaml
# Modified for a Docker host

- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Enable unattended-upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    regexp: '^\s*\"(APT::Periodic::Unattended-Upgrade)\".*;'
    line: '"APT::Periodic::Unattended-Upgrade" "1";'

# The upgrade above can pull in a new openssh-server, whose postinst stops ssh.service. Ubuntu 24.04
# activates sshd from ssh.socket, so nothing starts the service again until the next new connection,
# and systemd removes the unit's RuntimeDirectory, /run/sshd, when it stops. The `sshd -t` validation
# below needs that directory, and this play reuses its existing connection rather than opening a new
# one, so on any host with an openssh update pending the SSH tasks would fail with "Missing privilege
# separation directory". Starting the service recreates the directory and gives the reload below a
# live unit to reload.
- name: Ensure sshd is running before validating its configuration
  ansible.builtin.service:
    name: ssh
    state: started

# SSH Hardening
#
# sshd takes the first value it reads for most keywords, and Ubuntu's sshd_config includes
# sshd_config.d/*.conf at the top, so a line in sshd_config loses to any drop-in that sets the same
# keyword. Cloud images ship one: 50-cloud-init.conf sets PasswordAuthentication yes whenever the
# provider enabled password logins. The settings therefore go in 00-hardening.conf, which sorts ahead
# of the drop-ins Ubuntu and cloud-init ship, and `sshd -T`, which evaluates the configuration on disk
# with every drop-in, confirms they are in effect. That check is skipped under --check, where nothing
# was written.
#
# sshd is reloaded on every run once the check has passed, rather than by a handler. A run that
# stops after writing the files, whether a task fails, the connection drops or the operator
# interrupts it, would lose a handler's notification, and the rerun would find nothing changed and
# pass against the files on disk while sshd kept running the old configuration. A reload re-reads
# the configuration without dropping connections, including the one running this play.
#
# When the block fails, the rescue reloads only if the configuration on disk is still hardened: the
# three settings are no and AllowUsers names only configured users. The play cannot read what the
# running sshd has loaded, so it cannot tell a weaker drop-in waiting on disk from one already in
# effect, and it errs towards never activating extra users; the run fails either way. `sshd -T` shows
# global settings only, so a Match block in a waiting drop-in is not caught.
- name: Harden SSH
  vars:
    harden_ssh_users: "{{ (allowed_ssh_users + [docker_user]) | unique }}"
    harden_sshd_hint: >-
      Check that /etc/ssh/sshd_config includes /etc/ssh/sshd_config.d/*.conf, that no drop-in sorting
      before 00-hardening.conf sets PermitRootLogin, PasswordAuthentication or
      KbdInteractiveAuthentication, and that no other file sets AllowUsers; add SSH users through
      allowed_ssh_users.
  block:
    - name: Write the SSH hardening drop-in
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s

    # AllowUsers adds up across every file rather than taking the first value, so a leftover line
    # would keep allowing users that have since been removed from allowed_ssh_users. This removes
    # every unindented PermitRootLogin, PasswordAuthentication and AllowUsers line in sshd_config, not
    # only the ones earlier versions wrote.
    #
    # The validation evaluates the file as it would be after each removal, and refuses it unless the
    # hardened values still hold. On a host whose sshd_config does not include sshd_config.d, that is
    # what keeps the lines from being removed: there they are the only thing providing the hardening.
    - name: Remove the SSH settings earlier versions wrote to sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^{{ item }}\s'
        state: absent
        validate: >-
          /bin/sh -c 'c=$(/usr/sbin/sshd -T -f "$0") && echo "$c" | grep -qx "permitrootlogin no"
          && echo "$c" | grep -qx "passwordauthentication no" && echo "$c" | grep -q "^allowusers "' %s
      loop:
        - PermitRootLogin
        - PasswordAuthentication
        - AllowUsers

    - name: Read the effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: harden_sshd_effective
      changed_when: false
      when: not ansible_check_mode

    - name: Assert the SSH hardening is in effect
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in harden_sshd_effective.stdout_lines"
          - "'passwordauthentication no' in harden_sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in harden_sshd_effective.stdout_lines"
          - harden_sshd_allowusers | sort == harden_ssh_users | sort
        fail_msg: >-
          sshd's effective configuration does not match 00-hardening.conf, which sets
          PermitRootLogin, PasswordAuthentication and KbdInteractiveAuthentication to no and AllowUsers
          to {{ harden_ssh_users | join(' ') }}.
      vars:
        harden_sshd_allowusers: >-
          {{ harden_sshd_effective.stdout_lines | select('match', '^allowusers ')
          | map('regex_replace', '^allowusers ', '') | list }}
      when: not ansible_check_mode

    - name: Reload sshd to apply the SSH hardening
      ansible.builtin.service:
        name: ssh
        state: reloaded
      changed_when: false

  rescue:
    - name: Read the SSH configuration on disk after the failure
      ansible.builtin.command: /usr/sbin/sshd -T
      register: harden_sshd_on_disk
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Reload sshd if the configuration on disk is still hardened
      ansible.builtin.service:
        name: ssh
        state: reloaded
      register: harden_sshd_rescue_reload
      changed_when: false
      ignore_errors: true
      when:
        - not ansible_check_mode
        - harden_ssh_users is defined
        - harden_sshd_on_disk.rc == 0
        - "'permitrootlogin no' in harden_sshd_on_disk.stdout_lines"
        - "'passwordauthentication no' in harden_sshd_on_disk.stdout_lines"
        - "'kbdinteractiveauthentication no' in harden_sshd_on_disk.stdout_lines"
        - harden_sshd_disk_allowusers | length > 0
        - harden_sshd_disk_allowusers | difference(harden_ssh_users) | length == 0
      vars:
        harden_sshd_disk_allowusers: >-
          {{ harden_sshd_on_disk.stdout_lines | select('match', '^allowusers ')
          | map('regex_replace', '^allowusers ', '') | list }}

    - name: Fail with the original error
      vars:
        harden_sshd_keywords: '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|allowusers) '
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_task.name }}:
          {% if ansible_failed_result.results is defined %}refused to remove
          {{ ansible_failed_result.results | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item') | join(', ') }} from sshd_config, because sshd would not be hardened
          after the removal.
          {% else %}{{ ansible_failed_result.msg | default('failed') }}
          {% endif %}
          {% if harden_sshd_on_disk is skipped %}
          {% elif harden_ssh_users is not defined %}sshd was not reloaded.
          {% elif harden_sshd_on_disk.rc != 0 %}sshd -T fails on the configuration on disk:
          {{ harden_sshd_on_disk.stderr_lines | join('; ') }}. sshd was not reloaded.
          {% else %}{{ ansible_failed_result.stderr_lines | default([]) | join('; ') }}
          sshd -T on the configuration on disk shows {{ harden_sshd_on_disk.stdout_lines
          | select('match', harden_sshd_keywords) | join(', ') }}.
          {% if harden_sshd_rescue_reload is skipped %}sshd was not reloaded, because that is not
          hardened, so the running sshd keeps its previous configuration, which may still accept
          passwords or other users.{% elif harden_sshd_rescue_reload is failed %}Reloading sshd failed:
          {{ harden_sshd_rescue_reload.msg | default('') }}{% else %}sshd was reloaded to apply
          it.{% endif %}
          {{ harden_sshd_hint }}{% endif %}

# Minimize Attack Surface
- name: Remove unnecessary packages
  ansible.builtin.apt:
    name:
      - telnet
      - ftp
      - rsh-client
      - nfs-common
      - cups
      - dnsutils
    state: absent

# Secure /tmp
- name: Secure /tmp partition
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noexec,nosuid,nodev"
    state: present

- name: Mount or remount /tmp with secure options
  ansible.builtin.raw: |
    if mountpoint -q /tmp; then
      mount --options remount,defaults,noexec,nosuid,nodev /tmp
    else
      mount --types tmpfs --options defaults,noexec,nosuid,nodev tmpfs /tmp
    fi
  changed_when: false

# Logging and Monitoring
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Set kernel parameters for hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    # Enables TCP SYN cookies to help prevent SYN flood attacks
    - {key: "net.ipv4.tcp_syncookies", value: "1"}
    # Enables reverse path filtering to mitigate IP spoofing
    - {key: "net.ipv4.conf.all.rp_filter", value: "1"}
    # Ensures all newly created interfaces also enforce IP spoofing prevention, complementing net.ipv4.conf.all.rp_filter
    - {key: "net.ipv4.conf.default.rp_filter", value: "1"}
    # Disables source routing, which is often exploited for attacks
    - {key: "net.ipv4.conf.all.accept_source_route", value: "0"}
    # Ignores ICMP echo requests sent to broadcast addresses to prevent smurf attacks
    - {key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1"}
    # Logs packets with invalid IP addresses for easier troubleshooting and detection of potential attacks
    - {key: "net.ipv4.conf.all.log_martians", value: "1"}
    # IP forwarding is required for proper network traffic forwarding in a multi-node setup
    - {key: "net.ipv4.ip_forward", value: "1"}
    # Ensures any newly added interfaces also reject source-routed packets by default, maintaining a secure baseline
    - {key: "net.ipv4.conf.default.accept_source_route", value: "0"}
    # Randomizes the memory address space of processes, making it significantly harder for attackers to predict addresses during exploitation attempts, such as buffer overflows
    - {key: "kernel.randomize_va_space", value: "2"}
    # Prevents sensitive information (like passwords or cryptographic keys) from being leaked through core dumps, which can be exploited by attackers to gain further system access
    - {key: "fs.suid_dumpable", value: "0"}
    # Disable IPv6
    - {key: "net.ipv6.conf.all.disable_ipv6", value: "1"}
    - {key: "net.ipv6.conf.default.disable_ipv6", value: "1"}
    # Disabling ICMP redirects
    - {key: "net.ipv4.conf.all.accept_redirects", value: "0"}
    - {key: "net.ipv4.conf.default.accept_redirects", value: "0"}
    # Prevent multiple kinds of attacks
    - {key: "net.ipv4.conf.all.secure_redirects", value: "0"}
    - {key: "net.ipv4.conf.default.secure_redirects", value: "0"}

# Docker-specific hardening
- name: Configure subuid for user namespace remapping
  # Allocates UID range 100000-165535 for the user, enabling Docker to remap container UIDs
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ docker_user }}:100000:65536"
    create: true
    mode: '0644'

- name: Configure subgid for user namespace remapping
  # Allocates GID range 100000-165535 for the user, enabling Docker to remap container GIDs
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "{{ docker_user }}:100000:65536"
    create: true
    mode: '0644'

- name: Install AppArmor utils and profiles
  ansible.builtin.apt:
    name:
      - apparmor-utils
      - apparmor-profiles
    state: present

# command rather than a shell pipe into grep, so there is no pipeline whose exit status has to be
# reasoned about.
- name: Check if Docker AppArmor profile is loaded
  ansible.builtin.command: apparmor_status
  register: harden_apparmor_status
  failed_when: false
  changed_when: false
  # Reads nothing but the kernel's own view, so it is safe to run under --check, where the assert
  # below needs its stdout.
  check_mode: false

- name: Assert Docker AppArmor profile is loaded
  ansible.builtin.assert:
    that: "'docker' in harden_apparmor_status.stdout"
    fail_msg: "Docker AppArmor profile is not loaded. Ensure AppArmor is configured for Docker security."

- name: Configure Docker daemon for security
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "userns-remap": "{{ docker_user }}",
        "icc": false,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    mode: '0644'
  notify: Restart docker

- name: Restrict Docker socket permissions
  ansible.builtin.file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0660'
