# sshd listens on ssh_port. The port this play is connected on stays open alongside it, so the move
# takes two runs and never strands the play: the second, with ansible_port set to ssh_port, closes 22.
#
# Ubuntu 24.04 starts sshd from ssh.socket, whose ports sshd-socket-generator takes from the Port
# lines on a daemon-reload, so only restarting the socket moves them. That restarts ssh.service too,
# but KillMode=process keeps open sessions, this play's included.

# "client_ip client_port server_ip server_port". Read without become, which drops it, and empty for a
# local connection.
- name: Read the port this play is connected on
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: harden_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false

- name: Work out the ports sshd listens on
  ansible.builtin.set_fact:
    harden_ssh_ports: "{{ ([ssh_port] + harden_ssh_connection.stdout.split()[3:4]) | map('int') | unique | sort }}"

- name: Write the SSH port drop-in
  ansible.builtin.template:
    src: sshd-port.conf.j2
    dest: /etc/ssh/sshd_config.d/10-port.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s

# Port adds up across files, so a Port line elsewhere keeps its port open too.
- name: Read the ports in sshd's effective configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: harden_sshd_effective
  changed_when: false
  check_mode: false

- name: Assert sshd is configured for exactly the SSH ports
  ansible.builtin.assert:
    that: harden_sshd_ports == harden_ssh_ports
    fail_msg: >-
      sshd is configured for ports {{ harden_sshd_ports | join(', ') }}, not
      {{ harden_ssh_ports | join(', ') }}. Remove the other Port lines from sshd_config and sshd_config.d.
  # --check does not write the drop-in.
  when: not ansible_check_mode
  vars:
    harden_sshd_ports: >-
      {{ harden_sshd_effective.stdout_lines | select('match', '^port ')
      | map('regex_replace', '^port ', '') | map('int') | unique | sort }}

# Compared with what sshd listens on rather than notified, so a run that stopped before applying the
# drop-in is caught up by the next one.
- name: Read the ports sshd is listening on
  ansible.builtin.command: ss --no-header --listening --tcp --numeric --processes
  register: harden_ssh_listening
  changed_when: false
  check_mode: false

- name: Read whether sshd is socket activated
  ansible.builtin.systemd_service:
    name: ssh.socket
  register: harden_ssh_socket

# Without socket activation, a reload re-executes sshd, which binds the new ports itself.
- name: Move sshd onto the SSH ports
  ansible.builtin.systemd_service:
    name: "{{ 'ssh.socket' if harden_ssh_socket_active else 'ssh' }}"
    state: "{{ 'restarted' if harden_ssh_socket_active else 'reloaded' }}"
    daemon_reload: true
  when: harden_ssh_listening_ports != harden_ssh_ports
  vars: &harden_ssh_listening_vars
    harden_ssh_socket_active: "{{ harden_ssh_socket.status.ActiveState == 'active' }}"
    harden_ssh_listening_ports: >-
      {{ harden_ssh_listening.stdout_lines | select('search', '"sshd"')
      | map('split') | map(attribute=3) | map('regex_replace', '^.*:', '') | map('int') | unique | sort }}

- name: Wait for sshd to listen on exactly the SSH ports
  ansible.builtin.command: ss --no-header --listening --tcp --numeric --processes
  register: harden_ssh_listening
  changed_when: false
  until: harden_ssh_listening_ports == harden_ssh_ports
  retries: 10
  delay: 1
  vars: *harden_ssh_listening_vars
  when: not ansible_check_mode

- name: Report the SSH port cutover still to do
  ansible.builtin.debug:
    msg: >-
      sshd listens on {{ harden_ssh_ports | join(' and ') }}. Set ansible_port to {{ ssh_port }} in
      the inventory, open {{ ssh_port }} in any provider firewall, and run again to close the rest.
  when: harden_ssh_ports | length > 1
