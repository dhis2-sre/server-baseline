# Host services are reached through INPUT, which ufw filters. Published container ports are not:
# Docker rewrites their destination in the nat table, so that traffic is forwarded and only crosses
# DOCKER-USER, which the template filters. Both are driven by the same port lists.
#
# See https://docs.docker.com/engine/network/packet-filtering-firewalls/

# Anything else ends up verbatim in iptables-restore input, where ufw fails to load it.
- name: Assert the listed ports are port numbers or ranges
  ansible.builtin.assert:
    that: (firewall_allowed_ports + firewall_allowed_udp_ports) | map('string') | reject('match', '^[0-9]+(:[0-9]+)?$') | list | length == 0
    fail_msg: firewall_allowed_ports and firewall_allowed_udp_ports take bare ports such as 443, or ranges such as 8000:8100.

# The port sshd accepted this connection on, whatever the inventory or ~/.ssh/config says. Empty
# when the play does not run over SSH.
- name: Read the SSH port this play is connected on
  ansible.builtin.command: printenv SSH_CONNECTION
  register: firewall_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: Assert the SSH port this play connects on stays open
  ansible.builtin.assert:
    that: firewall_ssh_connection.stdout.split() | last | int in (firewall_allowed_ports | map('int') | list)
    fail_msg: >-
      This play is connected on port {{ firewall_ssh_connection.stdout.split() | last }}, which is not
      in firewall_allowed_ports. Enabling the firewall would lock the host out.
  when: firewall_ssh_connection.stdout | length > 0

# Ubuntu's ufw package declares Breaks on both. Purged so the rules earlier versions of this role
# saved under /etc/iptables go too.
- name: Remove iptables-persistent
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: true
  become: true

- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  register: firewall_ufw_install
  become: true

# Under --check on a host without ufw, which includes every host an earlier version of this role
# managed, there are no rule files or ufw binary for these tasks to inspect.
- name: Configure ufw
  when: not (ansible_check_mode and firewall_ufw_install is changed)
  become: true
  block:
    - name: Write the DOCKER-USER rules into ufw's after rules
      ansible.builtin.blockinfile:
        path: "/etc/ufw/{{ item }}"
        marker: "# {mark} sre.server.firewall DOCKER-USER"
        block: "{{ lookup('ansible.builtin.template', 'docker-user.rules.j2') }}"
      loop:
        - after.rules
        - after6.rules
      notify: Reload ufw

    - name: Set ufw default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        default: "{{ item.policy }}"
      loop:
        - {direction: incoming, policy: deny}
        - {direction: outgoing, policy: allow}
        - {direction: routed, policy: deny}

    # The comment is what the cleanup below uses to tell this role's rules from ones added by hand.
    - name: Allow listed ports
      community.general.ufw:
        rule: allow
        port: "{{ item.split('/') | first }}"
        proto: "{{ item.split('/') | last }}"
        comment: sre.server.firewall
      loop: "{{ firewall_rules }}"

    # Read only, so it also runs under --check, where the cleanup below needs its output.
    - name: List the rules ufw has been given
      ansible.builtin.command: ufw show added
      register: firewall_ufw_added
      changed_when: false
      check_mode: false

    - name: Close ports this role opened that are no longer listed
      community.general.ufw:
        rule: allow
        port: "{{ item.split('/') | first }}"
        proto: "{{ item.split('/') | last }}"
        delete: true
      # Each line reads like: ufw allow 443/tcp comment 'sre.server.firewall'
      loop: >-
        {{ firewall_ufw_added.stdout_lines
           | select('search', " comment 'sre\.server\.firewall'$")
           | map('regex_replace', '^ufw allow (\S+) .*$', '\1')
           | list
           | difference(firewall_rules) }}

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Start ufw on boot
      ansible.builtin.service:
        name: ufw
        enabled: true
