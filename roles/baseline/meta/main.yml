galaxy_info:
  author: DHIS2 SRE
  description: The complete server baseline - bootstrap, then firewall, then harden.
  license: Apache-2.0
  min_ansible_version: '2.15'
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - docker
    - firewall
    - hardening
    - ubuntu

# The composition itself, which is why this role has no tasks of its own. Ansible runs dependencies
# in the order they are listed and before the role's own tasks, and the order matters: bootstrap
# installs the Docker Engine, firewall locks down the DOCKER-USER chain that installing it creates,
# and harden reconfigures the daemon and the host around both.
#
# Listing a role here rather than duplicating its tasks also means a consumer that runs, say,
# dhis2.sre.bootstrap directly and dhis2.sre.baseline afterwards gets bootstrap once: Ansible skips
# a dependency that already ran in the same play with the same parameters.
dependencies:
  - role: dhis2.sre.bootstrap
  - role: dhis2.sre.firewall
  - role: dhis2.sre.harden
