name: Release

on:
  push:
    tags: [ 'v*' ]

# Needed by `gh release create`.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install ansible-core

      # ansible-galaxy takes the installed version from galaxy.yml, not from the tag, so a tag that
      # disagrees with it installs something whose version is a lie. Catch that here rather than in
      # a consumer wondering why pinning v1.2.0 gave them 1.1.0.
      - name: Check the tag matches galaxy.yml
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          galaxy_version=$(sed --quiet 's/^version: *//p' galaxy.yml)
          if [ "$tag_version" != "$galaxy_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match galaxy.yml version $galaxy_version" >&2
            exit 1
          fi

      - run: tests/run.sh

      - name: Build the collection
        run: ansible-galaxy collection build --output-path dist

      # Consumers install from the git tag, so the tarball is a convenience rather than the
      # distribution channel. It is attached so an air-gapped consumer has something to fetch.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz
