name: Validate

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # The ansible-lint hook pins its own environment to python3.13, so the runner has to have it.
      # If a future ansible-lint asks for something else, this step is where it fails and says so.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # yamllint and ansible-lint, the same hooks a committer runs locally. ansible-lint has to pass
      # at its production profile, which is what keeps the roles idiomatic as they change.
      - uses: pre-commit/action@v3.0.1
