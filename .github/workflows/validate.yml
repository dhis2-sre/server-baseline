name: Validate

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # The ansible-lint hook pins its own environment to python3.13, so the runner has to have it.
      # If a future ansible-lint asks for something else, this step is where it fails and says so.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # yamllint and ansible-lint, the same hooks a committer runs locally. ansible-lint has to pass
      # at its production profile, which is what keeps the roles idiomatic as they change.
      - uses: pre-commit/action@v3.0.1

  collection:
    name: Collection
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install ansible-core

      # Builds and installs the collection and syntax-checks the playbooks against the installed
      # copy, which is the only place the fully qualified role names have to resolve. Linting the
      # working tree cannot catch a wrong namespace, because there the bare names resolve too.
      - run: tests/run.sh
